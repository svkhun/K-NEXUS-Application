services:
  - type: web
    name: k-nexus-app
    runtime: docker
    repo: https://github.com/svkhun/K-NEXUS-Web
    branch: main
    region: singapore
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v2/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FORWARDED_ALLOW_IPS
        value: '*'
      - key: DEMO_SESSION_SECRET
        generateValue: true
