name: Verify prototype

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build and audit frontend
        run: |
          npm ci
          npm audit --audit-level=low
          npm run test:ui
          npm run build
      - name: Install and audit backend
        run: |
          pip install -r requirements-dev.txt
          pip check
          pip-audit -r requirements.lock --disable-pip --no-deps
      - name: Exercise API security boundary
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build Render container and verify startup
        run: |
          docker build -t k-flow-lab:ci .
          docker run -d --name k-flow-lab-ci -p 127.0.0.1:8090:10000 \
            -e ENVIRONMENT=production -e PUBLIC_ORIGIN=https://demo.example \
            -e DEMO_SESSION_SECRET=ci-only-ephemeral-secret-at-least-32-characters k-flow-lab:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/api/v2/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8090/api/v2/health
          curl --fail --silent http://127.0.0.1:8090/ | grep 'assets/'
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs k-flow-lab-ci 2>/dev/null || true
          docker rm -f k-flow-lab-ci 2>/dev/null || true
